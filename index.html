<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Peace — card games with friends</title>
  <meta name="description" content="Play Andar Bahar and Dragon Tiger with friends. Share a room code, bet coins, watch the cards fall.">
  <meta name="theme-color" content="#041C20">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;700;800&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="./" aria-label="Peace home">peace</a>
    <div class="topbar-right" id="topbar-game" hidden>
      <button class="room-chip" id="share-btn" type="button" aria-label="Share room link">
        <span class="room-chip-label" id="room-game">Room</span>
        <span class="room-chip-code" id="room-code">----</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5l-1.4 1.4L17.2 9H10a6 6 0 0 0-6 6v3h2v-3a4 4 0 0 1 4-4h7.2l-2.6 2.6L16 15l5-5z"/></svg>
      </button>
      <div class="bank" id="bank" aria-live="polite"><span class="bank-coin" aria-hidden="true"></span><span id="my-chips">0</span></div>
      <button class="icon-btn" id="mute-btn" type="button" aria-label="Sound on" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-on"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-off"><path d="M4 9v6h4l5 4V5L8 9H4zm12.6 3l2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
      </button>
      <button class="icon-btn leave-btn" id="leave-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3h9a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-9v-2h9V5h-9zm-1.6 4.6L9.8 9l-2 2H16v2H7.8l2 2-1.4 1.4L4 12z"/></svg>
        <span>Leave</span>
      </button>
    </div>
  </header>

  <!-- HOME -->
  <main id="home" class="view">
    <section class="hero">
      <div class="hero-table" id="hero-table" aria-hidden="true">
        <div class="hero-card hero-card--left"></div>
        <div class="hero-card hero-card--middle"></div>
        <div class="hero-card hero-card--right"></div>
      </div>
      <h1 class="title" id="game-title">Andar Bahar</h1>
      <p class="lede" id="game-lede"></p>

      <div class="picker" role="radiogroup" aria-label="Choose a game" id="picker"></div>

      <form class="entry" id="entry" autocomplete="off">
        <label class="field">
          <span>Your name</span>
          <input id="name" name="name" maxlength="16" placeholder="e.g. Pank" required>
        </label>
        <button class="btn btn-gold" id="create-btn" type="submit" data-action="create">Create a room</button>
        <div class="join-row">
          <label class="field field-code">
            <span>Room code</span>
            <input id="code" name="code" maxlength="4" placeholder="ABCD" autocapitalize="characters" spellcheck="false">
          </label>
          <button class="btn btn-ghost" type="submit" data-action="join">Join</button>
        </div>
        <p class="form-msg" id="form-msg" role="alert"></p>
        <button class="btn-link" type="submit" data-action="solo">Practise solo with 3 bots</button>
      </form>
    </section>

    <section class="how" aria-labelledby="how-title">
      <h2 id="how-title">How to play</h2>
      <ol class="steps" id="steps"></ol>
      <p class="payout-note" id="pay-note"></p>
    </section>
  </main>

  <!-- GAME -->
  <main id="game" class="view" hidden>
    <div class="game-layout">
      <div class="game-main">
        <section class="table" id="table" aria-label="Card table"></section>
        <section class="bet-panel" aria-label="Your bet">
          <div class="sides" id="sides"></div>
          <div class="tray">
            <div class="chip-row" role="radiogroup" aria-label="Coin value" id="chip-row"></div>
            <p class="bet-hint" id="bet-hint">Choose a coin, then tap a side.</p>
          </div>
        </section>
      </div>
      <aside class="side-info">
        <section class="players-box" aria-labelledby="players-title">
          <h2 id="players-title">At the table</h2>
          <ul class="players" id="players"></ul>
        </section>
        <section class="history-box" aria-labelledby="history-title">
          <h2 id="history-title">Last results</h2>
          <ol class="history" id="history"></ol>
        </section>
        <details class="rules-mini">
          <summary>How to play</summary>
          <p id="rules-mini"></p>
        </details>
      </aside>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
